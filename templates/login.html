<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Login - SINISTROS AI ENGINE</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            background:#020f2c;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

        }

        .login-box{

            background:#1d2b4d;

            width:420px;

            padding:40px;

            border-radius:20px;

            text-align:center;

        }

        h1{

            color:white;

            margin-bottom:10px;

            font-size:55px;

        }

        p{

            color:#d6d6d6;

            margin-bottom:30px;

        }

        input{

            width:100%;

            padding:15px;

            margin-bottom:20px;

            border:none;

            border-radius:8px;

            font-size:16px;

        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:8px;

            background:#37a8e8;

            color:white;

            font-size:18px;

            cursor:pointer;

        }

        button:hover{

            background:#2196d3;

        }

        .erro{

            background:#ff4b5c;

            color:white;

            padding:12px;

            border-radius:8px;

            margin-bottom:20px;

        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <p>SINISTROS AI ENGINE</p>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Usuário"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>

</html>
