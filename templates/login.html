<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SINISTROS AI ENGINE</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #06142b, #020b18);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            background:#1b2942;
            width:420px;
            padding:40px;
            border-radius:16px;
            box-shadow:0 0 25px rgba(0,0,0,0.4);
        }

        .login-box h1{
            color:white;
            text-align:center;
            margin-bottom:30px;
            font-size:42px;
        }

        .login-box input{
            width:100%;
            padding:15px;
            margin-bottom:18px;
            border:none;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }

        .login-box button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:8px;
            background:#35a8eb;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        .login-box button:hover{
            background:#1b8dd0;
        }

        .logo{
            text-align:center;
            font-size:55px;
            margin-bottom:10px;
        }

        .subtitulo{
            text-align:center;
            color:#c9d4e5;
            margin-bottom:30px;
            font-size:14px;
        }

        .erro{
            background:#ff4d4d;
            color:white;
            padding:12px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🔐</div>

        <h1>Login</h1>

        <div class="subtitulo">
            SINISTROS AI ENGINE
        </div>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST">

            <input 
                type="text" 
                name="username" 
                placeholder="Usuário"
                autocomplete="off"
                required
            >

            <input 
                type="password" 
                name="password" 
                placeholder="Senha"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>
</html>
